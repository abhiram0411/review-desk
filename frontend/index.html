<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Review Desk reviews pull requests and remembers every accept and reject decision.">
<meta name="theme-color" content="#0A0E0B">
<title>The Review Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Cpath d='M0 0h3v3H0zM4 0h3v3H4zM0 4h3v3H0z' fill='%236CCB8A'/%3E%3Cpath d='M4 4h3v3H4z' fill='%239A2F22'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root{color-scheme:dark;--paper:#0A0E0B;--panel:#111812;--ink:#B5E8C1;--mute:#7E9C86;--rule:#2F4634;--yes:#63C182;--no:#E0705C;--addbg:#12291A;--delbg:#331813;--acc:#6CCB8A}
*{box-sizing:border-box;border-radius:0}
html{scroll-padding-top:76px}
body{margin:0;background:var(--paper);color:var(--ink);font:22px/1.3 VT323,monospace;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--paper);padding:8px 12px;z-index:40}.skip:focus{left:8px}
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink)}
.tp{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding:10px 0}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;font:400 13px/1 "Press Start 2P",monospace}
.mk{display:grid;grid-template-columns:repeat(2,10px);gap:2px}.mk i{width:10px;height:10px;background:var(--ink)}.mk i:last-child{background:var(--no)}
.nav{display:flex;overflow-x:auto;max-width:100%}
.nav a{font:400 10px/1 "Press Start 2P",monospace;color:var(--ink);text-decoration:none;padding:12px 14px;border:1px solid var(--ink);margin-right:-1px;white-space:nowrap}
.nav a:hover{background:var(--panel)}
.nav a[aria-current=page]{background:var(--ink);color:var(--paper)}
a:focus-visible,.btn:focus-visible,.ix:focus-visible,.lnk:focus-visible,.diff:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1{font:400 clamp(20px,3.2vw,32px)/1.45 "Press Start 2P",monospace;margin:0}
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px 44px;align-items:end;padding:38px 0 30px;border-bottom:1px solid var(--rule)}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:26px 0 22px}}
.dek{font:400 25px/1.2 VT323,monospace;color:var(--mute);margin:14px 0 0;max-width:52ch}
.stat{border:1px solid var(--ink);background:var(--panel);padding:16px 18px}
.stat p{margin:8px 0 0}.stat .lnk{font-size:20px}
.lab{font:400 10px/1.6 "Press Start 2P",monospace;color:var(--mute);margin:0 0 12px}
main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:0 44px;padding:30px 0}
@media(max-width:920px){main{grid-template-columns:1fr}}
aside{position:sticky;top:76px;align-self:start}
@media(max-width:920px){aside{position:static}}
section{margin-bottom:34px}
.h{font:400 15px/1.5 "Press Start 2P",monospace;margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.rule{border-top:1px solid var(--rule);padding-top:14px}
.idx{max-height:250px;overflow:auto;border:1px solid var(--ink);background:var(--panel)}
.ix{display:grid;grid-template-columns:64px 1fr 70px;gap:8px;width:100%;text-align:left;padding:8px 12px;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.ix:hover{background:var(--paper)}
.ix[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.ix span:first-child,.ix span:last-child{font:400 18px VT323,monospace;opacity:.75;align-self:center}
.ix span:last-child{text-align:right}
.empty{border:1px dashed var(--mute);padding:22px;margin:14px 0 0;color:var(--mute);max-width:60ch}
.in{flex:1 1 300px;min-width:0;font:400 21px VT323,monospace;background:var(--panel);color:var(--ink);border:1px solid var(--ink);padding:8px 12px}
.diff{margin:14px 0 0;border:1px solid var(--ink);background:var(--panel);max-height:600px;overflow:auto;font:400 19px/1.5 VT323,monospace}
.dl{display:grid;grid-template-columns:52px 1fr;white-space:pre-wrap}
.dl i{font-style:normal;text-align:right;padding-right:10px;color:var(--mute);border-right:1px solid var(--rule);user-select:none}
.dl b{font-weight:400;padding:0 12px;overflow-wrap:anywhere}
.dl.add{background:var(--addbg)}.dl.del{background:var(--delbg)}.dl.hunk{color:var(--mute);background:var(--paper)}
.dl.file{position:sticky;top:0;z-index:2;background:var(--ink);color:var(--paper)}.dl.file i{border-color:var(--ink)}
.ic{margin:6px 12px 12px 62px;border:2px solid var(--ink);background:var(--paper);padding:10px 14px;white-space:normal;cursor:pointer}
@media(max-width:600px){.ic{margin-left:12px}}
.ic.on{outline:3px solid var(--ink);outline-offset:2px}
.ic.done{opacity:.6}
.ic h3{margin:4px 0;font:400 24px/1.15 VT323,monospace}
.meta{display:flex;gap:10px;font:400 18px VT323,monospace;color:var(--mute);flex-wrap:wrap;align-items:center}
.meta .n{color:var(--ink)}
.tag{border:1px solid var(--ink);color:var(--ink);padding:0 8px}
.btn{font:400 21px VT323,monospace;background:transparent;color:var(--ink);border:1px solid var(--ink);padding:8px 16px;cursor:pointer}
.btn:hover,.btn[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.btn.solid{background:var(--ink);color:var(--paper)}.btn.solid:hover{background:var(--panel);color:var(--ink)}
.btn.ok{border-color:var(--yes);color:var(--yes)}.btn.ok:hover{background:var(--yes);color:var(--paper)}
.btn.bad{border-color:var(--no);color:var(--no)}.btn.bad:hover{background:var(--no);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:default}
.acts{display:flex;gap:10px;margin-top:10px;align-items:center;flex-wrap:wrap}
.bar2{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
.yes{color:var(--yes)}.no{color:var(--no)}
kbd{font:400 17px VT323,monospace;border:1px solid var(--mute);padding:0 6px;margin-right:4px;color:var(--ink);background:var(--panel)}
.keys{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--mute);font-size:19px;margin-top:14px}
.settle{height:6px;border:1px solid var(--ink);margin-top:12px}.settle div{height:100%;background:var(--ink);transition:width .5s linear}
.pgb{height:8px;border:1px solid var(--ink);margin:0 0 12px}.pgb div{height:100%;background:var(--yes)}
.rl{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-top:1px solid var(--rule)}
.rl q{quotes:none;font:400 24px/1.15 VT323,monospace}
.st{font:400 9px "Press Start 2P",monospace;align-self:center}
.tally{grid-column:1/-1;font:400 18px VT323,monospace;color:var(--mute)}
.big{font:400 clamp(26px,4vw,42px)/1.3 "Press Start 2P",monospace}
.big small{font-size:.4em;color:var(--mute)}
.tb{width:100%;border-collapse:collapse;margin:18px 0 6px;border:1px solid var(--ink);background:var(--panel)}
.tb th,.tb td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--rule);vertical-align:top;font-weight:400}
.tb thead th{font:400 10px/1.5 "Press Start 2P",monospace;border-bottom:1px solid var(--ink)}
.tb tbody th{font-size:21px;color:var(--mute)}
.tb td{font:400 26px/1 VT323,monospace}
.mb{display:block;height:10px;min-width:2px;margin-top:6px}.mb.a{background:var(--mute)}.mb.b{background:var(--ink)}
.mrow{margin:16px 0 0}.mrow p{margin:0 0 6px;font-size:19px;color:var(--mute)}
.bar{display:flex;align-items:center;gap:10px;font:400 18px VT323,monospace;margin-bottom:5px}
.bar div{height:12px;min-width:2px}.bar.a div{background:var(--mute)}.bar.b div{background:var(--ink)}
.sk{background:var(--rule);opacity:.5;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.18}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}.settle div{transition:none}}
details{font-size:19px;color:var(--mute)}summary{cursor:pointer}details li{margin:6px 0}
.err{color:var(--no);font-size:20px;border:1px solid var(--no);padding:8px 12px}
.page{padding:32px 0 20px;max-width:820px}.page p{max-width:62ch}
.step{display:grid;grid-template-columns:48px 1fr;gap:12px;border-top:1px solid var(--rule);padding:14px 0}
.step>span{font:400 14px "Press Start 2P",monospace}
.step h3{margin:0 0 2px;font:400 28px/1.1 VT323,monospace}.step p{margin:0}
.toast{position:fixed;left:24px;bottom:24px;z-index:30;background:var(--ink);color:var(--paper);padding:10px 18px;font-size:21px}
footer{border-top:2px solid var(--ink);padding:18px 0 44px;display:flex;gap:10px 26px;flex-wrap:wrap;font-size:19px;color:var(--mute)}
footer .sp{flex:1 1 320px}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--ink);text-decoration:underline;cursor:pointer}
dialog{max-width:560px;background:var(--panel);color:var(--ink);border:1px solid var(--ink);padding:26px}
dialog::backdrop{background:rgba(20,19,15,.55)}
dialog h2{font:400 16px/1.5 "Press Start 2P",monospace;margin:0 0 12px}dialog p{margin:0 0 10px}
.rp{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding:10px 0 4px}
.rc{display:flex;flex-direction:column-reverse;gap:3px;flex:0 0 24px;opacity:.14}
.rc.on{opacity:1}
.sq{display:block;width:24px;height:14px}
.sq.a{background:var(--ink)}.sq.f{border:2px solid var(--ink)}.sq.r{background:var(--no)}
.lg{display:flex;align-items:center;gap:8px;font-size:19px}.lg .sq{width:18px}
.arm{border-top:1px solid var(--rule);padding-top:6px;margin-top:22px}
.arm h3{font:400 26px/1.1 VT323,monospace;margin:6px 0}
.tot{display:flex;gap:26px;flex-wrap:wrap;font:400 20px VT323,monospace;color:var(--mute)}
.tot b{font:400 22px "Press Start 2P",monospace;color:var(--ink)}
.tot b.z{color:var(--yes)}
input[type=range]{width:100%;accent-color:#6CCB8A}
.sk{opacity:.8}
::selection{background:var(--ink);color:var(--paper)}
*{scrollbar-color:var(--rule) var(--paper)}
.h::before{content:"> ";color:var(--acc)}
.cur{display:inline-block;width:.6em;height:1em;margin-left:4px;background:var(--acc);vertical-align:-.12em;animation:blink 1s steps(1) infinite}
.mk i:last-child{animation:blink 1.4s steps(1) infinite}
.toast{animation:in .25s steps(4) both}
[data-rv="0"]{opacity:0;transform:translate(-16px,12px)}
[data-rv="1"]{opacity:1;transform:none;transition:opacity .8s ease-out,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
.rc{transition:opacity .4s}
.rc.on .sq{animation:drop .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms)}
.rc.on .sq.r{animation:drop .45s cubic-bezier(.2,.8,.2,1) both,flash .9s ease-out both;animation-delay:calc(var(--i,0)*35ms)}
.tot b{display:inline-block;animation:tick .35s ease-out}
.draw{animation:draw 2.2s cubic-bezier(.4,0,.2,1) .2s both paused;stroke-dasharray:1}
.dot{animation:fade .4s ease-out 2.2s both paused}
.bar div,.mb{transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both paused}
.chart[data-rv="1"] .draw,.chart[data-rv="1"] .dot,.mrow[data-rv="1"] .bar div,.tb[data-rv="1"] .mb{animation-play-state:running}
@keyframes blink{50%{opacity:0}}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.6)}}
@keyframes flash{0%,35%{background:var(--ink)}}
@keyframes tick{from{opacity:.3;transform:translateY(-6px)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){.cur,.mk i:last-child,.toast,.rc.on .sq,.tot b,.dot,.bar div,.mb{animation:none}.draw{animation:none;stroke-dasharray:none}}
@media print{.top,footer,.toast{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,Fragment}=React;
const api=async(u,o)=>{const r=await fetch(u,o);if(!r.ok)throw new Error(u+" returned "+r.status);return r.json()};
const post=(u,b)=>api(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
const Sk=({h=14,w="100%",m="0 0 10px"})=><div className="sk" style={{height:h,width:w,margin:m}}/>;
const REASONS=["Not a priority for us","Against our conventions","Wrong for this code"];

const LEGAL={
 terms:["Terms of use",[
  "The Review Desk is a working prototype. It is provided as is, with no warranty of any kind.",
  "Review comments are generated by a language model. They can be wrong or incomplete, so a person should always decide what to act on.",
  "Only submit code you have the right to share with the third-party services listed in the privacy notice."]],
 privacy:["Privacy notice",[
  "Accounts, cookies and analytics are not used.",
  "When you press Review, the diff you selected is sent to Groq, which runs the language model that writes the comments.",
  "Each Accept or Reject, with the text of the comment and any reason you pick, is stored in a Hindsight memory bank so later reviews can recall it. A copy of the decision log is also kept in data/decisions.json on the machine running the server.",
  "Delete that file and the memory bank to remove what the desk has learned."]]};

function Legal({which,onClose}){
  const ref=useRef();
  useEffect(()=>{const d=ref.current;if(which&&!d.open)d.showModal();if(!which&&d.open)d.close()},[which]);
  const [t,ps]=which?LEGAL[which]:["",[]];
  return <dialog ref={ref} onClose={onClose}><h2>{t}</h2>{ps.map((p,i)=><p key={i}>{p}</p>)}
    <button className="btn" onClick={onClose}>Close</button></dialog>;
}

function parse(diff){
  const rows=[];let file="",n=0,inH=false;
  for(const l of diff.split("\n")){
    let k="";
    const h=l.match(/^@@ -\d+(?:,\d+)? \+(\d+)/);
    if(l.startsWith("diff --git")){inH=false;const m=l.match(/ b\/(.+)$/);file=m?m[1]:file;k="hunk"}
    else if(h){inH=true;n=+h[1]-1;k="hunk"}
    else if(!inH){k="hunk"}
    else if(l.startsWith("+")){n++;k="add"}
    else if(l.startsWith("-")){k="del"}
    else n++;
    rows.push({t:l,k,file,no:inH&&k!=="del"&&k!=="hunk"?n:0});
  }
  return rows;
}
function anchor(rows,c){
  const s=String(c.line||""),f=s.split(":")[0].trim(),m=s.match(/:(\d+)/);
  const ok=r=>r.file&&f&&(r.file.endsWith(f)||f.endsWith(r.file));
  let i=m?rows.findIndex(r=>ok(r)&&r.no===+m[1]):-1;
  if(i<0){const w=(s.split(":").slice(1).join(":").match(/[A-Za-z_]{4,}/)||[""])[0];
    if(w)i=rows.findIndex(r=>ok(r)&&r.k==="add"&&r.t.includes(w))}
  if(i<0)i=rows.findIndex(r=>ok(r)&&r.k==="add");
  if(i<0)i=rows.findIndex(r=>r.k==="add");
  return i<0?rows.length-1:i;
}

function Card({c,n,s}){
  const {done,act,setAct,rej,setRej,vote}=s,d=done[c.id];
  return <div id={"c-"+c.id} className={"ic"+(act===c.id?" on":"")+(d?" done":"")} onClick={()=>setAct(c.id)}>
    <div className="meta"><span className="n">{String(n).padStart(2,"0")}</span><span className="tag">{c.category.replace("_"," ")}</span><span>{c.line}</span></div>
    <h3>{c.comment}</h3>
    {d?<span className={d==="accept"?"yes":"no"}>{d==="accept"?"Accepted":"Rejected"}, and remembered</span>
    :rej===c.id?<div>
      <p className="lab" style={{margin:"6px 0"}}>Why reject it? Pick a reason, or skip</p>
      <div className="acts">{REASONS.map((r,i)=><button key={r} className="btn" onClick={e=>{e.stopPropagation();vote(c,"reject",r)}}>{i+1} {r}</button>)}
        <button className="btn" onClick={e=>{e.stopPropagation();vote(c,"reject","")}}>Skip reason</button>
        <button className="btn" onClick={e=>{e.stopPropagation();setRej(null)}}>Cancel</button></div></div>
    :<div className="acts"><button className="btn ok" onClick={e=>{e.stopPropagation();vote(c,"accept","")}}>Accept (A)</button>
      <button className="btn bad" onClick={e=>{e.stopPropagation();setAct(c.id);setRej(c.id)}}>Reject (R)</button></div>}
  </div>;
}

function Diff({rows,at,notes,s,chg}){
  return <div className="diff" tabIndex={0} aria-label="Patch with review comments">{rows.map((r,i)=>{
    const cs=at[i]||[];
    if(r.k==="hunk"&&/^(index |--- |\+\+\+ |new file|deleted file|old mode|new mode|similarity|rename |Binary)/.test(r.t))return null;
    if(chg&&!cs.length&&!["add","del","hunk"].includes(r.k))return null;
    const f=r.t.startsWith("diff --git");
    return <Fragment key={i}><div className={"dl "+r.k+(f?" file":"")}><i>{r.no||""}</i><b>{f?r.file:(r.t||" ")}</b></div>
      {cs.map(c=><Card key={c.id} c={c} n={notes.indexOf(c)+1} s={s}/>)}</Fragment>})}</div>;
}

function Results({m,loading}){
  if(loading) return <div><Sk h={64} w="60%"/><Sk/><Sk/><Sk w="80%"/></div>;
  if(!m) return <p className="lab">No replay results yet. Run replay_real.py.</p>;
  const a=m.memory_off.summary,b=m.memory_on.summary;
  const rate=s=>s.total_generated?Math.round(100*s.total_accepted/s.total_generated):0;
  const rows=[["Repeated rejections",a.total_repeat_rejected,b.total_repeat_rejected,""],
    ["Comments written",a.total_generated,b.total_generated,""],["Comments accepted",a.total_accepted,b.total_accepted,""],
    ["Acceptance rate",rate(a),rate(b),"%"]];
  return <div>
    <div className="big">{a.total_repeat_rejected} <small>to</small> {b.total_repeat_rejected}</div>
    <p style={{margin:"6px 0 0"}}>Repeated rejections across the replay of real Flask pull requests, without and with memory.</p>
    <table className="tb"><thead><tr><th>Measure</th><th>Without memory</th><th>With memory</th></tr></thead>
      <tbody>{rows.map(([l,x,y,u])=>{const mx=u?100:Math.max(x,y,1);return <tr key={l}><th scope="row">{l}</th>
        <td>{x}{u}<span className="mb a" style={{width:(x/mx*100)+"%"}}/></td>
        <td>{y}{u}<span className="mb b" style={{width:(y/mx*100)+"%"}}/></td></tr>})}</tbody></table>
  </div>;
}

function Progress({m}){
  const cum=a=>{let t=0;return a.map(r=>t+=(r.repeat_rejected||0))};
  const A=cum(m.memory_off.per_pr),B=cum(m.memory_on.per_pr),N=A.length;
  if(!N) return null;
  const mx=Math.max(1,...A,...B),X=i=>44+(N>1?i*(500/(N-1)):250),Y=v=>168-v/mx*140;
  const dd=a=>"M"+a.map((v,i)=>X(i)+","+Y(v)).join(" L");
  const cps=[1,5,10,20].filter(k=>k<=N);
  const tx={font:"16px VT323,monospace",fill:"var(--mute)"};
  return <div>
    <svg className="chart" viewBox="0 0 560 200" width="100%" role="img" aria-label="Running total of repeated rejections after each pull request, with and without memory">
      <line x1="44" y1="168" x2="544" y2="168" style={{stroke:"var(--ink)"}}/>
      <path className="draw" pathLength="1" d={dd(A)} fill="none" style={{stroke:"var(--mute)",strokeWidth:2}}/>
      <path className="draw" pathLength="1" d={dd(B)} fill="none" style={{stroke:"var(--ink)",strokeWidth:3}}/>
      <rect className="dot" x={X(N-1)-4} y={Y(A[N-1])-4} width="8" height="8" style={{fill:"var(--mute)"}}/>
      <rect className="dot" x={X(N-1)-4} y={Y(B[N-1])-4} width="8" height="8" style={{fill:"var(--ink)"}}/>
      <text x="4" y={Y(mx)+5} style={tx}>{mx}</text><text x="4" y="172" style={tx}>0</text>
      {A.map((_,i)=>((i+1)===1||(i+1)%5===0)&&<text key={i} x={X(i)} y="192" textAnchor="middle" style={tx}>{i+1}</text>)}
    </svg>
    <p className="lab">Dim line: without memory. Bright line: with memory. Horizontal axis: pull requests replayed, in merge order.</p>
    {cps.map(k=><div className="bar" key={k}>After {k} pull request{k>1?"s":""}: {A[k-1]} without memory, {B[k-1]} with memory</div>)}
  </div>;
}

function Replay({m}){
  const [n,setN]=useState(0),[play,setPlay]=useState(false);
  const off=m?m.memory_off.per_pr:[],on=m?m.memory_on.per_pr:[],N=off.length;
  useEffect(()=>{if(!play)return;const t=setInterval(()=>setN(x=>{if(x>=N){setPlay(false);return x}return x+1}),650);return()=>clearInterval(t)},[play,N]);
  if(m===undefined) return <div className="page"><Sk h={220}/></div>;
  if(!m||!N) return <div className="page"><p>No replay results yet. Run replay_real.py first.</p></div>;
  const mx=Math.max(1,...off.map(r=>r.generated),...on.map(r=>r.generated));
  const tot=(a,k)=>a.slice(0,n).reduce((t,r)=>t+(r[k]||0),0);
  const col=(r,i)=>{const sq=[...Array(r.accepted).fill("a"),...Array(Math.max(0,r.rejected-r.repeat_rejected)).fill("f"),...Array(r.repeat_rejected).fill("r")];
    return <div key={i} className={"rc"+(i<n?" on":"")} role="img" aria-label={"Pull request "+r.pr+": "+r.generated+" comments, "+r.repeat_rejected+" repeated rejections"}>{sq.map((k,j)=><span key={j} className={"sq "+k} style={{"--i":j}}/>)}</div>};
  const cur=n>0?[off[n-1],on[n-1]]:null;
  return <div className="page" style={{maxWidth:1100}}>
    <h2 className="h">Replay</h2>
    <p>Watch {N} real Flask pull requests go by in the order they were merged. Each block is one review comment.</p>
    <div className="bar2">
      <button className="btn solid" onClick={()=>{if(n>=N)setN(0);setPlay(!play)}}>{play?"Pause":"Play"}</button>
      <button className="btn" onClick={()=>{setPlay(false);setN(Math.min(N,n+1))}}>Next pull request</button>
      <button className="btn" onClick={()=>{setPlay(false);setN(0)}}>Reset</button>
    </div>
    <label className="lab" htmlFor="sc" style={{display:"block",margin:"16px 0 6px"}}>Pull request {n} of {N}</label>
    <input id="sc" type="range" min="0" max={N} value={n} onChange={e=>{setPlay(false);setN(+e.target.value)}}/>
    <p role="status" aria-live="polite" style={{minHeight:52}}>{cur?"#"+cur[0].pr+" "+cur[0].title+". Without memory: "+cur[0].generated+" comments, "+cur[0].repeat_rejected+" repeated rejections. With memory: "+cur[1].generated+" comments, "+cur[1].repeat_rejected+" repeated.":"Press Play, drag the slider, or step through one pull request at a time."}</p>
    {[["Without memory",off],["With memory",on]].map(([t,a])=>{const rr=tot(a,"repeat_rejected");return <section className="arm" key={t}>
      <h3>{t}</h3>
      <div className="tot"><span>Repeated rejections <b key={rr} className={rr===0?"z":""}>{rr}</b></span><span>Comments {tot(a,"generated")}</span><span>Accepted {tot(a,"accepted")}</span></div>
      <div className="rp" style={{minHeight:mx*17+14}}>{a.map(col)}</div></section>})}
    <div className="acts" style={{marginTop:18,gap:26}}>
      <span className="lg"><span className="sq a"/>Accepted</span>
      <span className="lg"><span className="sq f"/>Rejected for the first time</span>
      <span className="lg"><span className="sq r"/>Rejected again</span></div>
    <p style={{marginTop:18}}>Every block comes from the measured replay. Nothing on this page is simulated after the fact.</p>
  </div>;
}
function Type({t}){
  const [n,setN]=useState(0);
  useEffect(()=>{
    if(matchMedia("(prefers-reduced-motion:reduce)").matches){setN(t.length);return}
    const i=setInterval(()=>setN(x=>{if(x>=t.length){clearInterval(i);return x}return x+1}),28);
    return()=>clearInterval(i)},[t]);
  return <>{t.slice(0,n)}<span className="cur" aria-hidden="true"/><span style={{visibility:"hidden"}}>{t.slice(n)}</span></>;
}
const PAGES=["review","conventions","results","replay","how"];
const getPage=()=>{const p=location.hash.replace("#/","");return PAGES.includes(p)?p:"review"};
const Nav=({page})=><nav className="nav" aria-label="Pages">{[["review","Review"],["conventions","Conventions"],["results","Results"],["replay","Replay"],["how","How it works"]].map(([k,l])=><a key={k} href={"#/"+k} aria-current={page===k?"page":undefined}>{l}</a>)}</nav>;

function Rules({conv}){
  if(conv===null) return <div><Sk h={22}/><Sk h={22} w="80%"/><Sk h={22} w="65%"/></div>;
  if(!conv.learned.length) return <p>Nothing learned yet. Accept or reject a comment on the Review page and a rule will appear here.</p>;
  return <div>{conv.learned.map(r=><div className="rl" key={r.category}>
    <q>{r.rule}</q><span className={"st "+(r.status==="keep"?"yes":r.status==="avoid"?"no":"")}>{r.status==="keep"?"Keep":r.status==="avoid"?"Stop":"Mixed"}</span>
    <span className="tally">{r.accepted} accepted, {r.rejected} rejected</span></div>)}</div>;
}

function ConventionsPage({conv}){
  const [h,setH]=useState(null);
  useEffect(()=>{api("/decisions").then(setH).catch(()=>setH([]))},[]);
  return <div className="page">
    <h2 className="h">Learned conventions</h2>
    <p>Rules the reviewer follows, built from your accept and reject decisions.</p>
    <Rules conv={conv}/>
    <h2 className="h" style={{margin:"36px 0 14px"}}>Decision history</h2>
    {h===null?<div><Sk/><Sk/><Sk w="70%"/></div>
    :h.length===0?<p>No decisions recorded yet.</p>
    :h.map((d,i)=><div className="rl" key={i}>
      <q>{d.comment}</q><span className={"st "+(d.decision==="accept"?"yes":"no")}>{d.decision==="accept"?"Accepted":"Rejected"}</span>
      <span className="tally">{d.category.replace("_"," ")}{d.reason?", reason: "+d.reason:""}</span></div>)}
  </div>;
}

function ResultsPage({m}){
  const per=m?m.memory_off.per_pr.map((r,i)=>({n:r.pr,t:r.title,a:r.repeat_rejected,b:(m.memory_on.per_pr[i]||{}).repeat_rejected||0})):[];
  const mx=Math.max(1,...per.flatMap(r=>[r.a,r.b]));
  return <div className="page">
    <h2 className="h">Measured results</h2>
    <Results m={m} loading={m===undefined}/>
    <p><a className="lnk" href="#/replay">Watch the replay, one pull request at a time</a></p>
    {m&&per.length>0&&<div><h2 className="h" style={{margin:"36px 0 14px"}}>Repeated rejections as memory builds</h2>
      <p>Running total after each pull request. The measured set has {per.length} pull requests. Without memory the total climbs as rejected kinds of comments keep coming back. With memory it stays at zero.</p>
      <Progress m={m}/></div>}
    {per.length>0&&<div><h2 className="h" style={{margin:"36px 0 14px"}}>Repeated rejections by pull request</h2>
      {per.map(r=><div className="mrow" key={r.n}><p>#{r.n} {r.t}</p>
        <div className="bar a"><div style={{width:(r.a/mx*70)+"%"}}/>{r.a} without memory</div>
        <div className="bar b"><div style={{width:(r.b/mx*70)+"%"}}/>{r.b} with memory</div></div>)}</div>}
    <h2 className="h" style={{margin:"36px 0 14px"}}>How this was measured</h2>
    <p>Real merged pull requests from the Flask repository were replayed in the order they were merged. A scripted reviewer accepted security, validation, error handling and bug comments and rejected everything else.</p>
    <p>The same pull requests ran twice, once with the memory bank and once without. A repeated rejection is a comment in a category the team had already rejected on an earlier pull request.</p>
    <p>Each run was made once and model output varies, so exact figures shift between runs. The accepted counts are not a stable effect: in an earlier run on 10 pull requests they went down with memory, and in this one they went up.</p>
  </div>;
}

function HowPage(){
  const steps=[["Review","The selected diff goes to a language model, which writes comments, labels each one with a category such as security, error handling or style, and places it on the line it refers to."],
    ["Decide","You accept or reject each comment, with an optional reason. Every decision is saved with the text of the comment and its category."],
    ["Remember","Decisions are stored in a Hindsight memory bank, which turns them into short facts about what your team wants."],
    ["Recall","Before the next review the agent recalls those facts, leaves out the kinds of comments your team turned down, and checks every diff for the kinds it accepted."]];
  return <div className="page">
    <h2 className="h">How it works</h2>
    {steps.map(([t,d],i)=><div className="step" key={t}><span>{i+1}</span><div><h3>{t}</h3><p>{d}</p></div></div>)}
    <h2 className="h" style={{margin:"36px 0 14px"}}>Built with</h2>
    <p>Python and FastAPI for the server, Hindsight for memory, Groq running gpt-oss-120b for reviews, the GitHub API for real pull requests and React for this page.</p>
  </div>;
}

function App(){
  const [prs,setPrs]=useState(null),[pr,setPr]=useState(null),[loadPr,setLoadPr]=useState(false);
  const [notes,setNotes]=useState([]),[mem,setMem]=useState([]),[busy,setBusy]=useState(false);
  const [done,setDone]=useState({}),[conv,setConv]=useState(null),[met,setMet]=useState(undefined);
  const [err,setErr]=useState(""),[legal,setLegal]=useState(null),[ran,setRan]=useState(false);
  const [act,setAct]=useState(null),[rej,setRej]=useState(null),[chg,setChg]=useState(false);
  const [until,setUntil]=useState(0),[now,setNow]=useState(Date.now()),[toast,setToast]=useState(null);
  const [page,setPage]=useState(getPage());
  const [ro,setRo]=useState(false),[url,setUrl]=useState("");
  const rows=useMemo(()=>pr?parse(pr.diff):[],[pr]);
  const at=useMemo(()=>{const o={};notes.forEach(c=>{const i=anchor(rows,c);(o[i]=o[i]||[]).push(c)});return o},[rows,notes]);
  const left=Math.max(0,Math.ceil((until-now)/1000));
  useEffect(()=>{const f=()=>{setPage(getPage());window.scrollTo(0,0)};window.addEventListener("hashchange",f);return()=>window.removeEventListener("hashchange",f)},[]);
  const loadConv=()=>api("/conventions").then(setConv).catch(()=>setConv({learned:[]}));
  useEffect(()=>{
    api("/demo-prs").then(setPrs).catch(e=>{setErr("Cannot reach the server. "+e.message+". Start it with python -m uvicorn main:app --port 8000");setPrs([])});
    api("/metrics").then(setMet).catch(()=>setMet(null));
    api("/config").then(c=>setRo(!!c.read_only)).catch(()=>{});
    loadConv();
  },[]);
  useEffect(()=>{if(until<=Date.now())return;const t=setInterval(()=>{setNow(Date.now());if(Date.now()>=until)clearInterval(t)},500);return()=>clearInterval(t)},[until]);
  useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(null),2600);return()=>clearTimeout(t)},[toast]);
  useEffect(()=>{const el=act&&document.getElementById("c-"+act);if(el)el.scrollIntoView({block:"nearest"})},[act]);
  const pick=async n=>{setNotes([]);setMem([]);setDone({});setErr("");setRan(false);setPr(null);setAct(null);setRej(null);setLoadPr(true);
    try{setPr(await api("/demo-prs/"+n))}catch(e){setErr(e.message)}setLoadPr(false)};
  const loadUrl=async()=>{setNotes([]);setMem([]);setDone({});setErr("");setRan(false);setPr(null);setAct(null);setRej(null);setLoadPr(true);
    try{setPr(await post("/github-pr",{url:"https://"+url.trim().replace(/^https?:\/\//,"")}))}
    catch(e){const m=e.message;setErr(/ 400/.test(m)?"Paste a link like https://github.com/owner/repo/pull/123":/ 404/.test(m)?"Pull request not found, or the repository is private.":/ 413/.test(m)?"That pull request is too large to review here.":/ 403/.test(m)?"Live reviews are turned off on this public link.":/ 429/.test(m)?"Too many requests. Wait a minute and try again.":"Could not load that pull request. "+m)}
    setLoadPr(false)};
  const review=async()=>{setBusy(true);setErr("");setDone({});setNotes([]);setRej(null);
    try{const r=await post("/review",{diff:pr.diff,title:pr.title,pr_number:pr.number});
      setNotes(r.comments);setAct(r.comments[0]?r.comments[0].id:null);setRan(true);const seen=new Set();
      setMem(r.memory_used.filter(t=>!/initializ/i.test(t)).filter(t=>{const k=t.slice(0,60);if(seen.has(k))return false;seen.add(k);return true}).slice(0,5));
    }catch(e){setErr(/403/.test(e.message)?"Live reviews are turned off on this public link. Watch the Replay page, or run the project locally to try one.":/429/.test(e.message)?"Too many requests. Wait a minute and try again.":"The review failed. "+e.message)}
    setBusy(false)};
  const vote=async(c,decision,reason)=>{try{await post("/feedback",{comment_id:c.id,decision,reason:reason||""});
    setDone(d=>({...d,[c.id]:decision}));setRej(null);setUntil(Date.now()+10000);setNow(Date.now());
    setToast({m:(decision==="accept"?"Accepted":"Rejected")+", and remembered",k:Date.now()});
    const nx=notes.find(x=>x.id!==c.id&&!done[x.id]);if(nx)setAct(nx.id);loadConv()}catch(e){setErr(e.message)}};
  const go=i=>{const n=notes[Math.min(notes.length-1,Math.max(0,i))];if(n)setAct(n.id)};
  useEffect(()=>{
    if(page!=="review"||!notes.length)return;
    const f=e=>{
      if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA/.test(e.target.tagName))return;
      const k=e.key.toLowerCase(),i=Math.max(0,notes.findIndex(c=>c.id===act)),c=notes[i];

      if(k==="j")go(i+1);else if(k==="k")go(i-1);

    window.addEventListener("keydown",f);return()=>window.removeEventListener("keydown",f)
  },[page,notes,act,rej,done]);
  const s={done,act,setAct,rej,setRej,vote};

    <header className="top"><div className="wrap tp">

        </aside>

      {page==="how"&&<HowPage/>}
      <footer>

        <button className="lnk" onClick={()=>setLegal("terms")}>Terms</button>
        <button className="lnk" onClick={()=>setLegal("privacy")}>Privacy</button>
      </footer>
    </div>

}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

/* Wave reveal: blocks fade in from top-left to bottom-right as they scroll into view. */
(function(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches||!("IntersectionObserver" in window))return;
  const SEL=".hero .dek,.hero .stat,main section>*,aside section>*,aside>p,.page>*,.step,.rl,.mrow,.tb,.chart,.keys";
  const io=new IntersectionObserver(es=>{
    es.filter(e=>e.isIntersecting)
      .sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top||a.boundingClientRect.left-b.boundingClientRect.left)
      .forEach((e,i)=>{
        e.target.style.setProperty("--d",Math.min(i*70+e.boundingClientRect.left/innerWidth*160,900)+"ms");
        e.target.dataset.rv="1";io.unobserve(e.target)})
  },{threshold:0,rootMargin:"0px 0px -6% 0px"});
  const tag=()=>document.querySelectorAll(SEL).forEach(el=>{if(!el.dataset.rv){el.dataset.rv="0";io.observe(el)}});
  new MutationObserver(tag).observe(document.getElementById("root"),{childList:true,subtree:true});
  tag();
})();
